{% extends 'base.html' %}

{% block title %}
Login - Home Tutor
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm border-0 p-4">

                <!-- HEADER -->

                <div class="text-center mb-4">

                    <div style="font-size:55px;">
                        🏠
                    </div>

                    <h2 class="fw-bold">
                        Welcome Back
                    </h2>

                    <p class="text-muted">
                        Login to your Home Tutor account
                    </p>

                </div>


                <!-- ERROR -->

                {% if error %}

                    <div class="alert alert-danger">
                        {{ error }}
                    </div>

                {% endif %}


                <!-- LOGIN FORM -->

                <form
                    method="POST"
                    action="{% url 'login' %}"
                >

                    {% csrf_token %}


                    <!-- NEXT URL -->

                    <input
                        type="hidden"
                        name="next"
                        value="{{ next|default:'' }}"
                    >


                    <!-- USERNAME -->

                    <div class="mb-3">

                        <label
                            class="form-label fw-semibold"
                            for="username"
                        >
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            value="{{ entered_username|default:'' }}"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="mb-4">

                        <label
                            class="form-label fw-semibold"
                            for="password"
                        >
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <!-- LOGIN -->

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        🔐 Login
                    </button>

                </form>


                <!-- REGISTER -->

                <div class="text-center mt-4">

                    <p class="mb-0 text-muted">
                        Don't have an account?
                    </p>

                    <a
                        href="{% url 'register' %}"
                        class="text-decoration-none fw-semibold"
                    >
                        Register
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
